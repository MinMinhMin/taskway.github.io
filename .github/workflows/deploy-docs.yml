name: Deploy SDK documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and upload the static site
        uses: withastro/action@v6
        with:
          path: .
          build-cmd: npm test && npm run check && npm run build
        env:
          SITE_BASE_PATH: ${{ github.event.repository.name }}
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
